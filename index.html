    /* ---------- M2 ---------- */
    m2_nav: "2. 學習者現況：程度分布",
    m2_title: "學習者現況：學生程度分布",
    m2_overview: "學生的程度原本就呈 20%、60%、20% 的分布。本模組說明衡量學生程度的三個指標，以及教學應該把力氣放在哪裡。",
    m2_highlights: ["20% / 60% / 20%", "Input 投入（準備）", "Process 過程（參與）", "Output 產出（表現）", "提升前段 + 中段", "後段姑且沒緣分"],
    m2_p1: "板書中的鐘形曲線，描繪的是學生程度的原始分布：前段約 20%、中段約 60%、後段約 20%。這個分布並不是教學的結果，而是學生進入課堂時本來就存在的狀態。",
    m2_p2: "衡量學生程度有三個指標：第一是 Input 投入，指學生課前的準備程度；第二是 Process 過程，指學生在課堂中的參與程度；第三是 Output 產出，指學生最後的表現程度。三者構成一條完整的學習流程。",
    m2_p3: "教學的目標，是提升前段 20% 與中段 60% 學生在投入、過程、產出三方面的程度，也就是把大約八成的學生往上推。至於後段 20%，板書的說法是「姑且沒緣分」：教師的時間與心力有限，與其平均分散，不如集中在最有機會進步的多數學生身上，讓整體學習成效真正提升。",
    m2_terms: [
      { front: "Input 投入", back: "學生課前的準備程度。" },
      { front: "Process 過程", back: "學生在課堂中的參與程度。" },
      { front: "Output 產出", back: "學生最後的表現程度。" },
      { front: "20 / 60 / 20", back: "學生程度的原始分布；目標是提升前段 20% 與中段 60%。" }
    ],
    m2_wrapup: "本模組說明學生程度原本呈 20%、60%、20% 分布，並以投入（準備）、過程（參與）、產出（表現）三個指標衡量。教學目標是提升前段與中段約八成學生的程度，後段 20% 則姑且沒緣分。這個判斷讓教師把有限的心力集中在最有機會進步的多數學生身上，也為後續的環境建置與 AI 工具選擇提供方向。",
    m2_q: [
      { q: "板書中學生程度的原始分布為何？", opts: ["10% / 80% / 10%", "20% / 60% / 20%", "33% / 33% / 33%", "30% / 40% / 30%"], ans: _A1, exp: "板書的鐘形曲線標示 20%、60%、20%。" },
      { q: "「Process 過程」指的是學生的哪一種程度？", opts: ["準備程度", "參與程度", "表現程度", "出席程度"], ans: _A1, exp: "Process 過程對應學生在課堂中的參與程度。" },
      { q: "教學目標要提升哪些學生？", opts: ["只有前段 20%", "只有後段 20%", "前段 20% 與中段 60%", "所有學生平均分配"], ans: _A2, exp: "目標是提升前段 20% 與中段 60%，後段 20% 姑且沒緣分。" },
      { q: "「Output 產出」對應的是？", opts: ["表現程度", "準備程度", "參與程度", "注意力程度"], ans: _A0, exp: "Output 產出指學生最後的表現程度。" }
    ],

    /* ---------- M3 ---------- */
    m3_nav: "3. 目標語言：EML → T²MI",
    m3_title: "目標語言架構：EMI → EML → T²MI",
    m3_overview: "與其推動 EMI，不如推動 EML，讓學生能以英文作為學習的主要媒介；再進一步擴展到 T²MI，讓學科語言、自然語言與 AI 語言三者並用。",
    m3_highlights: ["EMI ✗ Instruction", "EML ○ Learning", "T²MI 三語的平方", "Subject language", "Natural language", "AI language", "Input：聽・讀", "Output：說・寫"],
    m3_p1: "EMI 是 English as a Medium of Instruction，焦點在教師如何用英文教。板書在 Instruction 旁打了叉，在 Learning 旁畫了圈：與其說要推動 EMI，不如說要推動 EML，也就是 English as a Medium of Learning，讓學生能夠以英文作為學習的主要媒介。重點從「教師怎麼教」轉向「學生怎麼學」。",
    m3_p2: "在 EML 之上，板書更提出 T²MI。第一層是三語：學科語言（Subject language）、人類自然語言（板書寫作 English language）、AI 語言（AI language）。第二層是把自然語言再分成三類：華語、英語或任一外語，以及母語。三語再乘上自然語言三類，就是 T² 的意思。",
    m3_p3: "母語指的是 Mother／First Language，涵蓋國家語言，包括原住民語、台語、客語與新住民語。語言技能也有兩種方向：聽與讀屬於 input-oriented，說與寫屬於 output-oriented。這兩種方向正好對應學生學習流程中的投入與產出。",
    m3_terms: [
      { front: "EML", back: "English as a Medium of Learning：讓學生以英文作為學習的主要媒介。" },
      { front: "T²MI", back: "三語的平方：學科、自然、AI 三語，自然語言又分華語、外語、母語三類。" },
      { front: "Subject language", back: "學科語言，即該學科的專業術語與概念。" },
      { front: "AI language", back: "與 AI 溝通的語言，例如提示、脈絡與 Skill 指令。" },
      { front: "母語", back: "Mother／First Language，包括原住民語、台語、客語與新住民語。" },
      { front: "Input / Output-oriented", back: "聽、讀屬於輸入導向；說、寫屬於輸出導向。" }
    ],
    m3_wrapup: "本模組說明語言目標的轉向：從以教師為中心的 EMI，轉向以學生為中心的 EML，讓學生以英文作為學習的主要媒介。進一步的 T²MI 包含兩層：第一層是學科語言、自然語言與 AI 語言三語；第二層是自然語言再分為華語、外語與母語三類。語言技能則分為聽、讀的輸入導向與說、寫的輸出導向。",
    m3_q: [
      { q: "板書認為應該推動什麼？", opts: ["EMI，以英文教學", "EML，以英文為學習的主要媒介", "全中文教學", "只學 AI 語言"], ans: _A1, exp: "Instruction 打叉、Learning 畫圈，重點是學生以英文為學習媒介。" },
      { q: "T²MI 第一層的三語是哪三種？", opts: ["華語、英語、母語", "學科語言、自然語言、AI 語言", "聽、說、讀", "台語、客語、原住民語"], ans: _A1, exp: "第一層三語為 Subject、Natural、AI language。" },
      { q: "在 T²MI 中，自然語言又分為哪三類？", opts: ["華語、英語或外語、母語", "學科、AI、程式", "聽讀、說寫、翻譯", "英式、美式、澳式英語"], ans: _A0, exp: "第二層把自然語言分為華語、英語或任一外語、母語。" },
      { q: "哪一組屬於 output-oriented 技能？", opts: ["聽與讀", "說與寫", "聽與說", "讀與寫"], ans: _A1, exp: "說與寫是輸出導向，聽與讀是輸入導向。" }
    ],

    /* ---------- M4 ---------- */
    m4_nav: "4. 課堂環境：六項工具",
    m4_title: "流程一：課堂環境建置",
    m4_overview: "板書「1. 環境」列出六項課堂工具，涵蓋教師呈現、學生筆記、即時互動、資源入口，以及兩種 AI 輔助學習方式。",
    m4_highlights: ["Desktop camera", "In-class note", "In-class Q&A", "AI 教學資源總入口", "ChatGPT Voice Mode", "Chrome 內建 Gemini", "Attention-based"],
    m4_p1: "前三項處理課堂的基本互動。第一項是教師用的 desktop camera，可呈現傳統板書或電子白板，與事先準備好的數位、多媒體教材形成對照。第二項是學生的 in-class note（或錄音），設計原則是 attention-based：注意力是稀缺資源，筆記要幫助學生把注意力放在重點上。第三項是 in-class Q&A，例如 Slido、Mentimeter，讓師生即時互動。",
    m4_p2: "第四項是 AI 教學資源總入口，板書以 Σ 魚池形容：把 AI、Education、Motivation、EMI 等各類資源匯集在同一個入口，讓學生能自己去釣需要的資源。",
    m4_p3: "後兩項是 AI 輔助學習。第五項是 ChatGPT 的 Voice Mode：學生可以自己和 AI 對話、練習唸讀，也可以把小組討論錄音交給 AI 去聽、呼喚重點並總整理。第六項是 Chrome 內建的 Gemini，能讀取瀏覽器中的網頁與影片內容，而且不限語言，例如把一段中文解說轉成附有時間戳記的英文逐字稿。",
    m4_terms: [
      { front: "Desktop camera", back: "教師用來呈現板書或電子白板，對照事先備好的數位教材。" },
      { front: "Attention-based", back: "以注意力為核心的設計，因為注意力是稀缺資源。" },
      { front: "In-class Q&A", back: "課堂即時問答工具，例如 Slido、Mentimeter。" },
      { front: "Σ 魚池", back: "AI 教學資源總入口，匯集 AI、Education、Motivation、EMI 等資源。" },
      { front: "Voice Mode", back: "ChatGPT 語音模式：學生自己對話、唸讀，或整理小組討論錄音。" },
      { front: "Chrome 內建 Gemini", back: "讀取網頁與影片內容，不限語言，例如產出附時間戳記的英文逐字稿。" }
    ],
    m4_wrapup: "本模組整理了六項課堂環境工具。前三項（desktop camera、in-class note、in-class Q&A）建立課堂的呈現、筆記與互動基礎，並以注意力稀缺為設計原則；第四項 AI 教學資源總入口像一座魚池，匯集各類資源；後兩項 ChatGPT Voice Mode 與 Chrome 內建 Gemini，則讓學生能用 AI 跨語言聽、說、讀、寫，是實踐 EML 與 T²MI 的具體途徑。",
    m4_q: [
      { q: "In-class note 的設計原則是什麼？", opts: ["attention-based，因為注意力稀缺", "越詳細越好", "全部由教師代寫", "只能用紙筆"], ans: _A0, exp: "板書標示 attention-based，並註明注意力（scarcity）稀缺。" },
      { q: "板書以什麼形容 AI 教學資源總入口？", opts: ["高速公路", "Σ 魚池", "圖書館", "駕訓班"], ans: _A1, exp: "AI 教學資源總入口被形容為 Σ 魚池。" },
      { q: "下列哪一項是 in-class Q&A 工具的例子？", opts: ["Slido、Mentimeter", "Excel、Word", "Photoshop", "電子郵件"], ans: _A0, exp: "板書舉例 Slido 與 Mentimeter。" },
      { q: "Chrome 內建 Gemini 的應用例子是？", opts: ["自動批改考卷", "把中文解說轉成附時間戳記的英文逐字稿", "管理學生出缺勤", "製作簡報範本"], ans: _A1, exp: "板書例子：中文解說 → English transcript with time stamps。" }
    ],

    /* ---------- M5 ---------- */
    m5_nav: "5. AI 能力：L1 → L5",
    m5_title: "流程二：AI 能力進階",
    m5_overview: "AI 能力可分為五個層次：提示工程、脈絡工程、駕馭工程，再到半自動化的工作流，以及全自動化的代理式 AI。",
    m5_highlights: ["L1 Prompt", "L2 Context", "L3 Harness", "L4 Skills／Workflow", "L5 Agentic AI", "ReAct", "PDCA"],
    m5_p1: "前三個層次是使用 AI 的基本功。L1 Prompt engineering（提示工程）學習如何下指令；L2 Context engineering（脈絡工程）學習提供 AI 適當的背景資訊；L3 Harness engineering（駕馭工程）則要兼顧資安、倫理、風險，以及效率與可靠度，讓 AI 安全地為我所用。",
    m5_p2: "L4 是半自動化：從 Project（例如 GPTs、Gems）到 Skills，再到例行化的工作流（routinized workflow）。板書舉的例子是 KB.md：先整理一份 Markdown 知識庫，再據以產出 SVG、SPA、PWA、影片與 Podcast。",
    m5_p3: "L5 是全自動化：透過 loop（heartbeat）定時運作，形成代理式 AI（Agentic AI）。它的運作遵循 ReAct 循環：Plan、Reasoning、Action、Observation，觀察結果後再回到規劃；也可以用 PDCA 循環來理解：Plan、Do、Check、Adjust，持續修正與改善。",
    m5_terms: [
      { front: "Prompt engineering", back: "提示工程：學習如何對 AI 下清楚的指令。" },
      { front: "Context engineering", back: "脈絡工程：提供 AI 適當的背景資訊與資料。" },
      { front: "Harness engineering", back: "駕馭工程：兼顧資安、倫理、風險與效率可靠度。" },
      { front: "Skills", back: "可重複使用的任務指令包，屬於半自動化層次。" },
      { front: "Agentic AI", back: "代理式 AI：透過 loop 自行規劃、推理、行動與觀察。" },
      { front: "ReAct", back: "Plan → Reasoning → Action → Observation 的循環。" }
    ],
    m5_wrapup: "本模組說明 AI 能力的五個層次。L1 到 L3 分別是提示工程、脈絡工程與駕馭工程，其中駕馭工程需兼顧資安、倫理、風險與效率可靠度。L4 半自動化以 Project、Skills 與例行化工作流為核心，例如由 KB.md 產出 SVG、SPA、PWA 與 Podcast。L5 全自動化透過 loop 形成代理式 AI，並以 ReAct 與 PDCA 循環持續運作。",
    m5_q: [
      { q: "Harness engineering 需要兼顧哪些面向？", opts: ["資安、倫理、風險、效率與可靠度", "字型、顏色、排版", "價格、促銷、通路", "出席、點名、成績"], ans: _A0, exp: "板書在 harness 旁列出資安、倫理、風險、效率／可靠度。" },
      { q: "板書中半自動化的例子是？", opts: ["手寫板書", "紙本考試", "KB.md 產出 SVG、SPA、PWA、影片、Podcast", "口頭報告"], ans: _A2, exp: "板書例子為 KB.md → SVG、SPA、PWA、影片、Podcast。" },
      { q: "ReAct 循環的順序為何？", opts: ["Action → Plan → Obs. → Reasoning", "Plan → Reasoning → Action → Obs.", "Reasoning → Obs. → Plan → Action", "Obs. → Action → Reasoning → Plan"], ans: _A1, exp: "ReAct 依序為 Plan、Reasoning、Action、Observation。" },
      { q: "讓 AI 達到全自動化的關鍵機制是？", opts: ["單次提示", "複製貼上", "人工排程", "Loop（heartbeat）"], ans: _A3, exp: "板書以 loop（heartbeat）連到全自動化與 Agentic AI。" }
    ],

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-36" onClick={() => handleFlip(origIdx)}>

          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qIdx => [...Array(questions[qIdx].opts.length).keys()].sort(() => Math.random() - 0.5)));

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrongQs = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
        else wrongQs.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isGrpSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_, i) => selected[currentStart + i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups - 1 && (
                <button onClick={() => setGroupIdx(groupIdx + 1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

    low: 'Bottom 20%: not this time', mid: 'Middle 60%: target to lift, first priority', high: 'Top 20%: target to lift, keep stretching',
    note: 'The 30 / 70 thresholds are illustrative only.',
    check: 'Check', reset: 'Reset', right: '✓ Correct', wrong: '✗ Not quite. Answer: ',
    langOpts: ['Subject language', 'Natural language', 'AI language'],
    langItems: [
      { s: 'Telling ChatGPT to summarise a group discussion recording', a: _A2 },
      { s: 'Using subject terms such as "value chain" and "five forces" correctly in a report', a: _A0 },
      { s: 'Explaining what you learnt today to your family in Hakka', a: _A1 },
      { s: 'Explaining the key points of class to an exchange student in English', a: _A1 },
      { s: 'Writing a Skill so the AI builds web pages through a fixed workflow', a: _A2 }
    ],
    lvOpts: ['L1 Prompt', 'L2 Context', 'L3 Harness', 'L4 Semi-automation', 'L5 Full automation'],
    lvItems: [
      { s: 'Typing "summarise this article" into ChatGPT', a: _A0 },
      { s: 'Uploading the syllabus and rubric, then asking the AI to give feedback on assignments', a: _A1 },
      { s: 'Setting rules: no student personal data uploaded, and AI output spot-checked for accuracy', a: _A2 },
      { s: 'Building a Skill that turns any KB.md into an SPA', a: _A3 },
      { s: 'Setting the AI to check for new data daily, plan and run updates, then report back', a: _A4 }
    ],
    next: 'Next step', auto: 'Auto play', stop: 'Stop',
    react: [['Plan', 'Set the goal and steps'], ['Reasoning', 'Reason about what to do next'], ['Action', 'Take an action, e.g. call a tool'], ['Obs.', 'Observe the result, then plan again']],
    pdca: [['Plan', 'Plan'], ['Do', 'Do'], ['Check', 'Check'], ['Adjust', 'Adjust, then plan again']],
    step: 'Current step'
  }
};
const labCard = 'bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700';
const btnP = 'px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40';
const btnS = 'px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700';

const LabPlacement = ({ lang, info }) => {
  const L = LT[lang];
  const [v, setV] = useState([50, 50, 50]);
  const avg = Math.round((v[0] + v[1] + v[2]) / 3);
  const seg = avg < 30 ? 'low' : avg <= 70 ? 'mid' : 'high';
  return (
    <div className={labCard}>
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{info.title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{info.desc}</p>
      {[L.in, L.pr, L.out].map((lab, i) => (
        <label key={i} className="block mb-3 text-sm">
          <span className="flex justify-between"><span>{lab}</span><span className="font-bold">{v[i]}</span></span>
          <input type="range" min="0" max="100" value={v[i]} onChange={e => { const n = [...v]; n[i] = +e.target.value; setV(n); }} className="w-full accent-[#004030] dark:accent-[#D8C3A5]" />
        </label>
      ))}
      <div className="relative h-8 mt-4 rounded-lg overflow-hidden flex text-[11px] font-bold">
        <div className="w-[30%] bg-slate-200 dark:bg-slate-700 flex items-center justify-center">20%</div>
        <div className="w-[40%] bg-[#004030]/15 dark:bg-[#D8C3A5]/15 flex items-center justify-center">60%</div>
        <div className="w-[30%] bg-[#004030]/30 dark:bg-[#D8C3A5]/30 flex items-center justify-center">20%</div>
        <div className="absolute -top-1 -bottom-1 w-0.5 bg-red-500 transition-all" style={{ left: `calc(${avg}% - 2px)` }} />
      </div>
      <p className="mt-4 text-sm">{L.avg}：<b>{avg}</b></p>
      <p className={`mt-1 font-bold ${seg === 'low' ? 'text-slate-500' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{L[seg]}</p>
      <p className="mt-2 text-xs text-slate-400">{L.note}</p>
    </div>
  );
};

const ScenarioLab = ({ lang, info, kind }) => {
  const L = LT[lang];
  const items = kind === 'lang' ? L.langItems : L.lvItems;
  const opts = kind === 'lang' ? L.langOpts : L.lvOpts;
  const [pick, setPick] = useState({});
  const [shown, setShown] = useState(false);
  const score = items.filter((it, i) => pick[i] === _d(it.a)).length;
  return (
    <div className={labCard}>
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{info.title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{info.desc}</p>
      <div className="space-y-4">
        {items.map((it, i) => (
          <div key={i}>
            <p className="text-sm font-medium mb-2">{i + 1}. {it.s}</p>
            <div className="flex flex-wrap gap-2">
              {opts.map((o, j) => {
                const sel = pick[i] === j, ok = j === _d(it.a);
                const cls = shown ? (ok ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : sel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700')
                  : sel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/10 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400';
                return <button key={j} onClick={() => !shown && setPick(p => ({ ...p, [i]: j }))} className={`px-3 py-1.5 text-xs rounded-full border ${cls}`}>{o}</button>;
              })}
            </div>
            {shown && <p className={`text-xs mt-1 ${pick[i] === _d(it.a) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>{pick[i] === _d(it.a) ? L.right : L.wrong + opts[_d(it.a)]}</p>}
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-5">
        <button className={btnP} disabled={Object.keys(pick).length < items.length || shown} onClick={() => setShown(true)}>{L.check}</button>
        <button className={btnS} onClick={() => { setPick({}); setShown(false); }}>{L.reset}</button>
        {shown && <span className="text-sm font-bold">{score} / {items.length}</span>}
      </div>
    </div>
  );
};

const LabCycle = ({ lang, info }) => {
  const L = LT[lang];
  const [mode, setMode] = useState('react');
  const [idx, setIdx] = useState(0);
  const [auto, setAuto] = useState(false);
  const steps = L[mode];
  useEffect(() => {
    if (!auto) return;
    const id = setInterval(() => setIdx(i => (i + 1) % 4), 1500);
    return () => clearInterval(id);
  }, [auto]);
  const pos = [[150, 40], [260, 130], [150, 220], [40, 130]];
  return (
    <div className={labCard}>
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{info.title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{info.desc}</p>
      <div className="flex gap-2 mb-4">
        {['react', 'pdca'].map(m => (
          <button key={m} onClick={() => { setMode(m); setIdx(0); }}
            className={`px-3 py-1.5 text-xs rounded-full border font-bold ${mode === m ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]' : 'border-slate-300 dark:border-slate-600'}`}>{m === 'react' ? 'ReAct' : 'PDCA'}</button>
        ))}
      </div>
      <div className="flex justify-center" onContextMenu={noCtx}>
        <svg viewBox="0 0 300 260" className="w-full max-w-xs h-auto text-[#004030] dark:text-[#D8C3A5]" draggable="false">
          <circle cx="150" cy="130" r="90" fill="none" stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="5 5" />
          {pos.map((p, i) => (
            <g key={i}>
              <circle cx={p[0]} cy={p[1]} r="32" strokeWidth="2"
                className={i === idx ? 'fill-[#004030] dark:fill-[#D8C3A5] stroke-[#004030] dark:stroke-[#D8C3A5]' : 'fill-white dark:fill-slate-900 stroke-slate-300 dark:stroke-slate-600'} />
              <text x={p[0]} y={p[1] + 5} textAnchor="middle" fontSize="11" fontWeight="700"
                className={i === idx ? 'fill-white dark:fill-[#004030]' : 'fill-slate-700 dark:fill-slate-200'}>{steps[i][0]}</text>
            </g>
          ))}
          <text x="150" y="135" textAnchor="middle" fontSize="12" className="fill-slate-400">↻</text>
        </svg>
      </div>
      <p className="text-center text-sm mt-2"><span className="text-slate-400">{L.step}：</span><b>{steps[idx][0]}</b> — {steps[idx][1]}</p>
      <div className="flex justify-center gap-3 mt-4">
        <button className={btnP} onClick={() => setIdx(i => (i + 1) % 4)}>{L.next}</button>
        <button className={btnS} onClick={() => setAuto(a => !a)}>{auto ? L.stop : L.auto}</button>
        <button className={btnS} onClick={() => { setIdx(0); setAuto(false); }}>{L.reset}</button>
      </div>
    </div>
  );
};

/* ===== App ===== */
const MOD_ICONS = ['🧭', '🚗', '📊', '🗣️', '🏫', '🤖', '🧪', '🌐', '📈'];
const LS_KEY = 'AVC_SPA_analytics';
const LS_STU = 'AVC_SPA_student';
const LS_VER = 'AVC_SPA_version';
const emptyAnalytics = () => ({
  time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
  quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
  cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
  wrongTopics: {}
});
const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };

function App() {
  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group: '', dept: '', id: '', nameEn: '', nameZh: '' }));
  const [analytics, setAnalytics] = useState(() => {
    const a = loadLS(LS_KEY, null);
    return a && Array.isArray(a.time) && a.time.length === TOTAL ? a : emptyAnalytics();
  });
  const menuRef = useRef(null);
  const moduleRef = useRef(0);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en-GB'; }, [lang]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => { moduleRef.current = module; }, [module]);

  useEffect(() => {
    try {
      const v = localStorage.getItem(LS_VER);
      if (v && v !== APP_VER && window.confirm(dict.en.analytics_refresh_prompt + '\n' + dict.zh.analytics_refresh_prompt)) {
        setAnalytics(emptyAnalytics());
      }
      localStorage.setItem(LS_VER, APP_VER);
    } catch {}
  }, []);

  useEffect(() => {
    const id = setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      setAnalytics(a => { const tm = [...a.time]; tm[moduleRef.current] += 1; return { ...a, time: tm }; });
    }, 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  useEffect(() => { if ('speechSynthesis' in window) speechSynthesis.cancel(); setTtsState('idle'); }, [module, lang]);

  const navTitle = (i) => i === 0 ? t.m0_nav : i <= NUM_LEARN ? t[`m${i}_nav`] : i === IDX_LAB ? t.mlab_nav : i === IDX_RES ? t.mres_nav : t.mana_nav;
  const pageTitle = (i) => i === 0 ? t.m0_title : i <= NUM_LEARN ? t[`m${i}_title`] : i === IDX_LAB ? t.mlab_title : i === IDX_RES ? t.mres_title : t.analytics_title;
  const modulesList = [...Array(TOTAL).keys()].map(i => ({ id: i, num: i, icon: MOD_ICONS[i], nav: navTitle(i), title: pageTitle(i) }));
  const sideIcon = (i) => i === IDX_LAB ? <IconZapLab size={16} /> : i === IDX_RES ? <IconGlobe size={16} /> : i === IDX_ANA ? <IconActivity size={16} /> : <span aria-hidden="true">{MOD_ICONS[i]}</span>;

  const go = (i) => { setModule(i); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal];
      qc[mid] = correct; qt[mid] = total;
      const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || [];
      return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: wt };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal];
      cr[mid] = Math.max(cr[mid], readCount); ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (action === 'play') {
      if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
      speechSynthesis.cancel();
      const sep = lang === 'zh' ? '。 ' : '. ';
      let texts = [];
      if (module === 0) {
        texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc,
          ...(t.m0_stats || []).map(s => `${s.label}: ${s.val}`),
          ...(t.m0_modules || []).map(m => `${m.title}. ${m.desc}`)];
      } else if (module >= 1 && module <= NUM_LEARN) {
        const mk = `m${module}`;
        texts = [t[`${mk}_title`], t[`${mk}_overview`], ...(t[`${mk}_highlights`] || []),
          ...[1, 2, 3, 4, 5, 6, 7, 8].map(n => t[`${mk}_p${n}`]).filter(Boolean),
          t[`${mk}_wrapup`], ...(t[`${mk}_terms`] || []).flatMap(tm => [tm.front, tm.back])];
      } else if (module === IDX_LAB) {
        texts = [t.mlab_title, t.mlab_desc, ...(t.mlab_labs || []).map(l => `${l.title}. ${l.desc || ''}`)];
      } else if (module === IDX_RES) {
        texts = [t.mres_title, t.mres_desc, ...(t.mres_groups || []).flatMap(g => [g.title, ...g.links.map(l => `${l.label}. ${l.desc}`)])];
      } else if (module === IDX_ANA) {
        const tc = analytics.quizCorrect.reduce((a, b) => a + b, 0);
        const ta = analytics.quizTotal.reduce((a, b) => a + b, 0);
        const oa = ta > 0 ? Math.round(tc / ta * 100) : 0;
        const wk = [];
        for (let i = 1; i <= NUM_LEARN; i++) {
          if (analytics.quizTotal[i] > 0) {
            const a = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100);
            if (a < 75) wk.push({ name: modulesList[i].title, acc: a });
          }
        }
        wk.sort((a, b) => a.acc - b.acc);
        texts = [t.analytics_title, t.analytics_desc,
          `${t.analytics_total_time}: ${analytics.time.reduce((a, b) => a + b, 0)}${t.analytics_sec}`,
          `${t.analytics_total_clicks}: ${analytics.clicks.reduce((a, b) => a + b, 0)}${t.analytics_times}`,
          `${t.analytics_overall_acc}: ${oa}%`];
        if (wk.length) { texts.push(t.analytics_wp_tts_intro); wk.forEach(w => texts.push(t.analytics_wp_tts_module.replace('{name}', w.name).replace('{acc}', w.acc))); }
        else if (ta > 0) texts.push(t.analytics_wp_tts_allpass);
      }
      texts = texts.filter(Boolean).map(s => String(s).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, ''));
      const utt = new SpeechSynthesisUtterance(texts.join(sep));
      utt.rate = 0.95;
      const voices = speechSynthesis.getVoices();
      if (lang === 'zh') {
        const v = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
        if (v) utt.voice = v; utt.lang = 'zh-TW';
      } else {
        const v = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
        if (v) utt.voice = v; utt.lang = 'en-GB';
      }
      utt.onend = () => setTtsState('idle');
      utt.onerror = () => setTtsState('idle');
      speechSynthesis.speak(utt);
      setTtsState('playing');
    }
  };

  /* ---------- Views ---------- */
  const renderHome = () => (
    <div className="space-y-8 animate-fade-in">
      <H2 icon={MOD_ICONS[0]} number={0}>{t.m0_title}</H2>
      <div className="rounded-2xl bg-[#004030] dark:bg-slate-800 p-6 md:p-10 border border-[#D8C3A5]/30 shadow-lg">
        <p className="text-[#D8C3A5] text-xs sm:text-sm tracking-widest uppercase font-bold mb-3">{t.subtitle}</p>
        <p className="text-base md:text-lg leading-relaxed text-slate-100">{t.m0_intro}</p>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        {t.m0_stats.map((s, i) => (
          <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 text-center">
            <p className="font-serif font-black text-3xl text-[#004030] dark:text-[#D8C3A5]">{s.val}</p>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">{s.label}</p>
          </div>
        ))}
      </div>
      <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-2">{t.m0_why}</h3>
        <p className="text-slate-700 dark:text-slate-300 leading-relaxed">{t.m0_why_desc}</p>
      </div>
      <div>
        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.m0_flow_title}</h3>
        <FigFlow lang={lang} />
      </div>
      <div className="space-y-3">
        {t.m0_modules.map((m, i) => (
          <button key={i} onClick={() => go(i + 1)}
            className="w-full text-left flex items-start gap-4 bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition-all">
            <span className="font-serif font-black text-2xl text-[#D8C3A5]">{m.num}</span>
            <span className="flex-1 min-w-0">
              <span className="block font-bold text-[#004030] dark:text-[#D8C3A5]">{m.title}</span>
              <span className="block text-sm text-slate-500 dark:text-slate-400 mt-1">{m.desc}</span>
            </span>
            <IconChevronRight size={18} className="mt-1 text-slate-400 shrink-0" />
          </button>
        ))}
      </div>
      <button onClick={() => go(1)} className="px-8 py-3 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-xl shadow hover:shadow-lg transition-all">{t.m0_start}</button>
    </div>
  );

  const renderLearn = () => {
    const mk = `m${module}`;
    const Fig = FIGS[module];
    return (
      <div className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
        <H2 icon={MOD_ICONS[module]} number={module}>{t[`${mk}_title`]}</H2>
        <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.overview_label}</h3>
          <p>{t[`${mk}_overview`]}</p>
        </div>
        <div>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.highlights_label}</h3>
          <div className="flex flex-wrap gap-2">
            {t[`${mk}_highlights`].map((h, i) => (
              <span key={i} className="px-3 py-1 bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] rounded-full text-sm font-medium">{h}</span>
            ))}
          </div>
        </div>
        <div className="space-y-4">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500">{t.deep_dive_label}</h3>
          <p>{t[`${mk}_p1`]}</p>
          <p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif">{t[`${mk}_p2`]}</p>
          <p>{t[`${mk}_p3`]}</p>
          {t[`${mk}_p4`] && <p>{t[`${mk}_p4`]}</p>}
          {t[`${mk}_p5`] && <p>{t[`${mk}_p5`]}</p>}
        </div>
        <div>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.figure_label}</h3>
          <div className="flex justify-center">{Fig && <Fig lang={lang} />}</div>
        </div>
        <FlipCardDeck key={`cards-${module}`} terms={t[`${mk}_terms`]} t={t} moduleId={module} onCardRead={handleCardRead} />
        <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-5">
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2">{t.wrapup_label}</h3>
          <p className="italic">{t[`${mk}_wrapup`]}</p>
        </div>
        <ModuleQuiz key={`quiz-${module}`} questions={t[`${mk}_q`]} t={t} moduleId={module} onQuizSubmit={handleQuizSubmit} moduleName={t[`${mk}_title`]} />
      </div>
    );
  };

  const renderLab = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={MOD_ICONS[IDX_LAB]} number={IDX_LAB}>{t.mlab_title}</H2>
      <p className="text-lg text-slate-600 dark:text-slate-300">{t.mlab_desc}</p>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <LabPlacement lang={lang} info={t.mlab_labs[0]} />
        <LabCycle lang={lang} info={t.mlab_labs[3]} />
        <ScenarioLab key={`l2-${lang}`} lang={lang} info={t.mlab_labs[1]} kind="lang" />
        <ScenarioLab key={`l3-${lang}`} lang={lang} info={t.mlab_labs[2]} kind="level" />
      </div>
    </div>
  );

  const renderRes = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={MOD_ICONS[IDX_RES]} number={IDX_RES}>{t.mres_title}</H2>
      <p className="text-lg text-slate-600 dark:text-slate-300">{t.mres_desc}</p>
      {t.mres_groups.map((g, i) => (
        <div key={i}>
          <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{g.title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{g.links.map((l, j) => <LinkCard key={j} {...l} />)}</div>
        </div>
      ))}
    </div>
  );

  const totalCards = [...Array(NUM_LEARN).keys()].reduce((s, i) => s + t[`m${i + 1}_terms`].length, 0);
  const sumRead = analytics.cardsRead.reduce((a, b) => a + b, 0);
  const sumQC = analytics.quizCorrect.reduce((a, b) => a + b, 0);
  const sumQT = analytics.quizTotal.reduce((a, b) => a + b, 0);
  const formOK = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;

  const exportCSV = () => {
    if (!formOK) return;
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [
      ['Group', studentInfo.group], ['Dept', studentInfo.dept], ['Student ID', studentInfo.id],
      ['English Name', studentInfo.nameEn], ['Chinese Name', studentInfo.nameZh], ['Exported', new Date().toLocaleString()], [],
      ['Module', 'Time (s)', 'Clicks', 'Cards Read', 'Cards Total', 'Quiz Correct', 'Quiz Total', 'Accuracy (%)', 'Wrong Questions']
    ];
    for (let i = 0; i < TOTAL; i++) {
      const isL = i >= 1 && i <= NUM_LEARN;
      const ct = isL ? t[`m${i}_terms`].length : '';
      const acc = analytics.quizTotal[i] > 0 ? Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100) : '';
      rows.push([modulesList[i].nav, analytics.time[i], analytics.clicks[i], isL ? analytics.cardsRead[i] : '', ct,
        isL ? analytics.quizCorrect[i] : '', isL ? analytics.quizTotal[i] : '', acc, (analytics.wrongTopics[i] || []).join(' | ')]);
    }
    rows.push(['TOTAL', analytics.time.reduce((a, b) => a + b, 0), analytics.clicks.reduce((a, b) => a + b, 0), sumRead, totalCards, sumQC, sumQT, sumQT ? Math.round(sumQC / sumQT * 100) : '', '']);
    const csv = '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
    const d = new Date();
    const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const fname = `${dict.zh.brand} ${dict.zh.title}_${studentInfo.nameEn} ${studentInfo.nameZh}_${ymd}.csv`;
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const clearAll = () => {
    if (!window.confirm(t.analytics_wp_clear_confirm)) return;
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_STU); } catch {}
    setAnalytics(emptyAnalytics());
    setStudentInfo({ group: '', dept: '', id: '', nameEn: '', nameZh: '' });
  };

  const renderAnalytics = () => {
    const weak = [];
    for (let i = 1; i <= NUM_LEARN; i++) {
      if (analytics.quizTotal[i] > 0) {
        const acc = Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100);
        if (acc < 75) weak.push({ i, acc });
      }
    }
    weak.sort((a, b) => a.acc - b.acc);
    const visitedN = [...Array(NUM_LEARN).keys()].filter(i => analytics.time[i + 1] > 0 || analytics.clicks[i + 1] > 0).length;
    const inp = 'w-full mt-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm';
    const stat = [
      [t.analytics_total_time, `${analytics.time.reduce((a, b) => a + b, 0)} ${t.analytics_sec}`],
      [t.analytics_total_clicks, `${analytics.clicks.reduce((a, b) => a + b, 0)}`],
      [t.analytics_overall_acc, sumQT ? `${Math.round(sumQC / sumQT * 100)}%` : '—'],
      [t.analytics_card_usage, `${totalCards ? Math.round(sumRead / totalCards * 100) : 0}%`]
    ];
    return (
      <div className="space-y-8 animate-fade-in">
        <H2 icon={MOD_ICONS[IDX_ANA]} number={IDX_ANA}>{t.analytics_title}</H2>
        <p className="text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>
        <p className="text-xs text-green-600 dark:text-green-400">{t.analytics_wp_saved}</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          {stat.map((s, i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
              <p className="text-xs text-slate-500 dark:text-slate-400">{s[0]}</p>
              <p className="font-serif font-black text-2xl text-[#004030] dark:text-[#D8C3A5] mt-2">{s[1]}</p>
            </div>
          ))}
        </div>

        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_progress_title}</h3>
          <div className="h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-4">
            <div className="h-full bg-[#004030] dark:bg-[#D8C3A5] transition-all" style={{ width: `${visitedN / NUM_LEARN * 100}%` }} />
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {[...Array(NUM_LEARN).keys()].map(k => {
              const i = k + 1, vis = analytics.time[i] > 0 || analytics.clicks[i] > 0, qd = analytics.quizTotal[i] > 0;
              return (
                <button key={i} onClick={() => go(i)} className="flex items-center justify-between gap-2 text-left text-sm px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5]">
                  <span className="truncate">{modulesList[i].nav}</span>
                  <span className="flex gap-1 shrink-0 text-[11px]">
                    <span className={`px-2 py-0.5 rounded-full ${vis ? 'bg-[#004030]/10 text-[#004030] dark:bg-[#D8C3A5]/10 dark:text-[#D8C3A5]' : 'bg-slate-100 dark:bg-slate-700 text-slate-400'}`}>{vis ? t.analytics_progress_visited : t.analytics_progress_not_visited}</span>
                    {qd && <span className="px-2 py-0.5 rounded-full bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400">{t.analytics_progress_quiz_done}</span>}
                  </span>
                </button>
              );
            })}
          </div>
        </div>

        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-3 flex items-center gap-2"><IconAlertTriangle size={18} />{t.analytics_wp_title}</h3>
          {weak.length === 0
            ? <p className="text-sm text-slate-500 flex items-center gap-2">{sumQT > 0 ? <><IconCheckCircle size={16} className="text-green-500" />{t.analytics_wp_allpass}</> : t.analytics_no_data}</p>
            : weak.map(w => (
              <div key={w.i} className="mb-4 p-4 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800">
                <p className="font-bold text-sm">{modulesList[w.i].title} — {w.acc}%</p>
                <p className="text-xs text-slate-500 mt-2">{t.analytics_wp_incorrect}</p>
                <ul className="list-disc pl-5 text-xs text-slate-600 dark:text-slate-300 mt-1">{(analytics.wrongTopics[w.i] || []).map((q, j) => <li key={j}>{q}</li>)}</ul>
                <button onClick={() => go(w.i)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-2 hover:underline">{t.analytics_wp_goto}</button>
              </div>
            ))}
        </div>

        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 overflow-x-auto">
          <table className="w-full text-sm min-w-[560px]">
            <thead><tr className="text-left text-xs text-slate-500 border-b border-slate-200 dark:border-slate-700">
              <th className="py-2 pr-2">{t.analytics_module}</th><th className="py-2 pr-2">{t.analytics_time}</th><th className="py-2 pr-2">{t.analytics_clicks}</th>
              <th className="py-2 pr-2">{t.analytics_cards_read_total}</th><th className="py-2">{t.analytics_correct_ans_total}</th></tr></thead>
            <tbody>
              {modulesList.map(m => {
                const isL = m.id >= 1 && m.id <= NUM_LEARN;
                return (
                  <tr key={m.id} className="border-b border-slate-100 dark:border-slate-700/50">
                    <td className="py-2 pr-2">{m.nav}</td>
                    <td className="py-2 pr-2">{analytics.time[m.id]} {t.analytics_sec}</td>
                    <td className="py-2 pr-2">{analytics.clicks[m.id]}</td>
                    <td className="py-2 pr-2">{isL ? `${analytics.cardsRead[m.id]} / ${t[`m${m.id}_terms`].length}` : '—'}</td>
                    <td className="py-2">{isL ? (analytics.quizTotal[m.id] > 0 ? `${analytics.quizCorrect[m.id]} / ${analytics.quizTotal[m.id]} / ${t[`m${m.id}_q`].length}` : t.analytics_no_data) : '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_form_title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label className="text-sm">{t.analytics_group}
              <select className={inp} value={studentInfo.group} onChange={e => setStudentInfo(s => ({ ...s, group: e.target.value }))}>
                <option value="">{t.analytics_group_select}</option>
                {t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select>
            </label>
            <label className="text-sm">{t.analytics_dept}
              <input className={inp} maxLength={20} placeholder={t.analytics_dept_ph} value={studentInfo.dept} onChange={e => setStudentInfo(s => ({ ...s, dept: sanitizeName(e.target.value).slice(0, 20) }))} />
            </label>
            <label className="text-sm">{t.analytics_id}
              <input className={inp} inputMode="numeric" placeholder={t.analytics_id_ph} value={studentInfo.id} onChange={e => setStudentInfo(s => ({ ...s, id: sanitizeStudentId(e.target.value) }))} />
            </label>
            <label className="text-sm">{t.analytics_name_en}
              <input className={inp} placeholder={t.analytics_name_en_ph} value={studentInfo.nameEn} onChange={e => setStudentInfo(s => ({ ...s, nameEn: sanitizeName(e.target.value) }))} />
            </label>
            <label className="text-sm">{t.analytics_name_zh}
              <input className={inp} placeholder={t.analytics_name_zh_ph} value={studentInfo.nameZh} onChange={e => setStudentInfo(s => ({ ...s, nameZh: sanitizeName(e.target.value) }))} />
            </label>
          </div>
          <div className="flex flex-wrap items-center gap-3 mt-5">
            <button onClick={exportCSV} disabled={!formOK} className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={clearAll} className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg">{t.analytics_wp_clear}</button>
            {!formOK && <span className="text-xs text-slate-400">{t.analytics_fill_required}</span>}
          </div>
        </div>
      </div>
    );
  };

  const renderPage = () => module === 0 ? renderHome() : module <= NUM_LEARN ? renderLearn() : module === IDX_LAB ? renderLab() : module === IDX_RES ? renderRes() : renderAnalytics();
  const hb = 'p-2 hover:bg-white/10 rounded-lg';

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <SvgDefs />
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-2 sm:px-4 h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className={hb} aria-label={t.nav_modules}>{menuOpen ? <IconX /> : <IconMenu />}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-64 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] py-2">
                  <p className="px-4 py-2 text-xs font-bold uppercase tracking-wider text-slate-400">{t.nav_modules}</p>
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span aria-hidden="true">{m.icon}</span><span className="truncate">{m.nav}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className={hb} aria-label={t.nav_home}><IconHome size={18} /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className={`${hb} flex items-center gap-1`} aria-label={t.audio_read} title={t.audio_read}>
              {ttsState === 'playing' ? <IconPause size={18} /> : <IconPlay size={18} />}
              <span className="hidden lg:inline text-xs">{t.audio_read}</span>
            </button>
            {ttsState !== 'idle' && <button onClick={() => handleTTS('stop')} className={hb} aria-label="Stop"><IconSquare size={16} /></button>}
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 sm:px-3 py-1 text-xs font-bold border border-[#D8C3A5]/60 text-[#D8C3A5] rounded-lg hover:bg-white/10">{lang === 'en' ? '中' : 'EN'}</button>
            <button onClick={() => setIsDark(!isDark)} className={hb} aria-label="theme">{isDark ? <IconSun size={18} /> : <IconMoon size={18} />}</button>
          </div>
        </div>
      </header>

      <div className="flex flex-1 max-w-7xl w-full mx-auto">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-800 sticky top-16 h-[calc(100vh-4rem)] overflow-y-auto py-6 px-3">
          <p className="px-3 mb-3 text-xs font-bold uppercase tracking-wider text-slate-400">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-left mb-1 transition-all ${module === m.id ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-800'}`}>
              <span className="w-5 flex justify-center shrink-0">{sideIcon(m.id)}</span><span className="truncate">{m.nav}</span>
            </button>
          ))}
        </aside>
        <main className="flex-1 min-w-0 px-4 sm:px-6 md:px-10 py-8 md:py-10"
          onClick={() => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return { ...a, clicks: c }; })}>
          <div className="max-w-4xl mx-auto" key={module}>
            {renderPage()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
              <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0}
                className="px-5 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1}
                className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>Architect:&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

if (!window.__BLOCKED) ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
